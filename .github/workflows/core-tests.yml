name: Chorderator core tests
on:
  workflow_dispatch:
  push:
    branches: [develop/v1.0.0]
    paths:
      - "src/ChordEngine.h"
      - "src/ChordVoicing.h"
      - "src/MidiChordProcessor.h"
      - "src/MidiDelivery.h"
      - "src/MidiTimeline.h"
      - "src/MidiControl.h"
      - "tests/ChordEngineTests.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/core-tests.yml"
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --verbose
